<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Travel AiGent demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: X Factor navy. Hero, then a live "control room": agent team | board | owner's phone, with a step ticker under it. Single dark look by choice. */
:root{
  color-scheme:dark;
  --deep:#050b16; --navy:#101724; --panel:#162033; --panel2:#1b2740; --line:#26324a;
  --cream:#F1EDE4; --muted:#9aa5b8; --orange:#E96B12; --amber:#ffab52; --ember:#c1321a; --ok:#4fc08d;
  --display:"Instrument Serif",Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--cream);font:16px/1.55 var(--body);overflow-x:hidden}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin:0 auto}
.hero{padding-block:44px 28px;background:radial-gradient(100% 90% at 85% 0%,#1d2a45 0%,var(--navy) 50%,var(--deep) 100%);position:relative;overflow:hidden}
.glow{position:absolute;width:480px;height:480px;right:-120px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(233,107,18,.32),transparent 65%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(-70px,50px) scale(1.12)}}
.hero .in{position:relative;display:grid;gap:14px}
.brand{display:flex;gap:10px;align-items:center;font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.brand svg{width:32px;height:32px}
.langs{display:flex;gap:6px;justify-content:flex-end}
.langs button{padding:6px 12px;font:700 12px var(--mono)}
.langs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.eyebrow{font:400 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
h1{font:400 clamp(38px,7vw,72px)/1.02 var(--display);margin:0;text-wrap:balance;max-width:18ch}
h1 i{background:linear-gradient(100deg,var(--amber),var(--orange) 55%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;max-width:60ch;color:#d5d9e2;font-size:1.08rem}
.note{font:400 12px var(--mono);color:var(--muted)}

/* control room */
.room{padding-block:24px 40px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
button{font:700 13px var(--mono);border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--cream);cursor:pointer}
button.primary{background:var(--orange);border-color:var(--orange);color:var(--navy)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.clock{margin-left:auto;font:700 14px var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:14px}
@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr}.phonecol{grid-column:1/-1}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.ph{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

.agents{display:grid;gap:8px}
.agent{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;transition:background .3s,border-color .3s}
.agent .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font:700 12px var(--mono);color:var(--amber)}
.agent b{display:block;font-weight:600;font-size:.95rem}
.agent small{color:var(--muted);font-size:.8rem;display:block}
.agent.on{background:rgba(233,107,18,.1);border-color:rgba(233,107,18,.55)}
.agent.on .ic{background:var(--orange);color:var(--navy);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(233,107,18,.18)}}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-height:240px}
@media (max-width:640px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;align-content:start;gap:8px;min-width:0}
.col h4{margin:0;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.col.wait h4{color:var(--amber)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;display:grid;gap:4px;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.card b{font-size:.88rem;font-weight:600}
.card small{color:var(--muted);font-size:.76rem}
.card .chip{justify-self:start;font:700 10px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,171,82,.15);color:var(--amber)}
.col.done .card .chip{background:rgba(79,192,141,.15);color:var(--ok)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.feed{margin-top:12px;display:grid;gap:6px;max-height:190px;overflow:auto}
.line{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:.86rem;animation:pop .4s}
.line span{font:400 11px var(--mono);color:var(--muted);padding-top:2px}
.line b{color:var(--amber);font-weight:600}

/* phone */
.phone{width:100%;max-width:250px;margin:0 auto;aspect-ratio:9/17;border-radius:32px;border:2px solid #33405A;background:#0a1120;padding:14px 12px;display:grid;grid-template-rows:auto 1fr;gap:10px;box-shadow:0 30px 60px -30px rgba(233,107,18,.45)}
.notch{width:70px;height:6px;border-radius:9px;background:#26324a;margin:0 auto}
.screen{display:grid;align-content:start;gap:8px;overflow:hidden}
.msg{background:var(--panel2);border-radius:12px;padding:9px 10px;font-size:.8rem;animation:pop .4s}
.msg .from{font:700 10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}
.approve{border:1px solid var(--orange);background:rgba(233,107,18,.08)}
.approve .btns{display:flex;gap:6px;margin-top:8px}
.approve .btns span{flex:1;text-align:center;font:700 11px var(--mono);padding:6px;border-radius:8px;border:1px solid var(--line)}
.approve .btns .yes{background:var(--orange);color:var(--navy);border-color:var(--orange)}
.approve.tapped .yes{animation:tap .6s}
@keyframes tap{40%{transform:scale(.9);box-shadow:0 0 0 8px rgba(233,107,18,.25)}}
.done-msg{border:1px solid rgba(79,192,141,.5)}

/* ticker + stats */
.ticker{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
@media (max-width:640px){.ticker{grid-template-columns:1fr}}
.say{font:400 clamp(20px,3.2vw,28px)/1.2 var(--display);margin:0;min-height:2.4em}
.say i{color:var(--orange)}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:right}
.stat b{display:block;font:400 30px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.stat small{font:400 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:22px;height:4px;border-radius:9px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--orange)}

/* why section */
.why{padding-block:40px;background:var(--navy)}
.why h2{font:400 clamp(30px,5vw,44px)/1.05 var(--display);margin:0 0 18px;text-wrap:balance}
.why h2 i{color:var(--orange)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.three div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px}
.three b{font:400 1.5rem/1.15 var(--display)}
.three p{margin:0;color:#cfd4de;font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tabs button{border-radius:999px;padding:8px 14px;font:700 13px var(--mono);background:transparent;border:1px solid #33405A;color:var(--cream);cursor:pointer}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:var(--navy)}

.topbar{padding:14px 16px 0}
.back{display:inline-block;text-decoration:none;font:700 13px var(--mono);border-radius:999px;padding:8px 14px;border:1px solid #33405A;color:var(--cream)}
.back:hover{border-color:var(--orange);color:var(--orange)}
.xf-stamp{background:#101724;color:#F1EDE4;margin-top:40px;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.xf-stamp .xf-in{max-width:720px;margin:0 auto;display:grid;gap:14px}
.xf-stamp .xf-row{display:flex;align-items:center;gap:10px}
.xf-stamp svg{width:28px;height:28px;flex:none}
.xf-stamp .xf-name{font:700 13px/1 "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#F1EDE4}
.xf-stamp .xf-hook{margin:0;font:400 clamp(22px,5vw,28px)/1.2 "Instrument Serif",Georgia,serif;color:#FFFFFF;max-width:32ch;text-wrap:balance}
.xf-stamp .xf-hook i{color:#E96B12}
.xf-stamp .xf-links{display:flex;flex-wrap:wrap;gap:8px}
.xf-stamp a{font:700 13px "Space Mono",ui-monospace,Consolas,monospace;border-radius:999px;padding:7px 14px;text-decoration:none;background:#E96B12;color:#101724}
.xf-stamp a:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.xf-stamp a.alt{background:transparent;border:1px solid #33405A;color:#F1EDE4}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 note:"Ejemplo de agencia, precios y lodges. Los agentes nunca envían, reservan ni pagan sin el sí de una persona.",

 hrs:"Horas ahorradas", taps:"Toques del dueño", whyH:"Qué significa para", pick:"Elija su tipo de negocio",

 cards:{
  dmc:[["Ninguna solicitud espera","Las agencias de Moscú, Londres o Hamburgo escriben por la noche. Su propuesta está lista antes de que otros DMC abran el correo."],["La oficina trabaja sola","Las facturas de los lodges se archivan por proyecto, se avisa a finanzas y el comprobante de pago vuelve al lodge. Nadie persigue papeles."],["Su conocimiento, guardado","Itinerarios anteriores, contratos con lodges, tarifas y fotos viven en una sola memoria. Sigue funcionando cuando un diseñador de viajes se va."]],
  agency:[["Ningún cliente espera","Los clientes escriben por la noche. La cotización está redactada, revisada y lista antes de que su asesor abra el correo."],["El seguimiento se hace solo","Los clientes callados reciben un recordatorio a tiempo, y las listas de visados y documentos salen con cada cotización. Su asesor aprueba cada paso."],["Su experiencia, guardada","Viajes anteriores, tarifas de proveedores y lo que gustó a los clientes viven en una memoria. Sigue funcionando cuando un asesor se va."]],
  lodge:[["Consultas respondidas en minutos","Agencias y DMC reciben tarifas y disponibilidad al día, preparadas para su aprobación, de día y de noche."],["Reservas y facturas, solas","Las reservas salen, las facturas se archivan por estancia y los comprobantes de pago vuelven. Nadie persigue papeles."],["Sus tarifas, sus reglas","Tarifas, temporadas y noches mínimas en un solo lugar. Nada sale sin su sí."]],
  activity:[["Reservas de todos los canales","Las solicitudes de agencias, hoteles y huéspedes directos reciben respuesta en su idioma, desde una sola bandeja."],["Disponibilidad siempre al día","Horarios, guías y vehículos se revisan antes de enviar cualquier cotización."],["Pagos y facturas de proveedores, archivados","Las facturas de proveedores se archivan, y los depósitos y saldos se cobran automáticamente."]]

 steps:[

  {t:"Lun 21:41",say:"El lector de solicitudes extrae lo importante: <i>3 clientes, Cataratas Victoria y safari, 10 días, unos $30,000.</i>",sub:"Resumen · 3 adultos · mayo 2027 · $30k",log:["21:41","<b>Lector de solicitudes</b>: 3 adultos, 10 días, Cataratas Victoria + safari, presupuesto $30k."],ph:[]},
  {t:"Lun 21:50",say:"El diseñador de itinerarios arma una ruta a partir de viajes que este DMC <i>ya vendió a clientes rusos.</i>",sub:"Ciudad del Cabo 3 · Cataratas Victoria 3 · Chobe 4",log:["21:50","<b>Itinerario</b>: 3 noches en Ciudad del Cabo, 3 en Cataratas Victoria, 4 en Chobe."],ph:[]},

  {t:"Mar 07:10",say:"Al desayuno, el dueño recibe una tarjeta: <i>propuesta lista para enviar a la agencia.</i>",sub:"¿Enviar la propuesta a la agencia?",log:["07:10","Tarjeta de aprobación enviada al teléfono del dueño."],ph:[["approve","Necesita aprobación","¿Enviar la propuesta de <b>$28,950</b> (10 días, en ruso) a la agencia de Moscú?","Aprobar"]]},
  {t:"Mar 07:12",say:"Un toque. La propuesta va a Moscú y <i>salen las reservas provisionales de los lodges.</i>",sub:"Enviada 07:12 · reservas enviadas",log:["07:12","Propuesta enviada a la agencia. Reservas provisionales enviadas a 4 lodges."],ph:[["approve tapped","Necesita aprobación","¿Enviar la propuesta de <b>$28,950</b> (10 días, en ruso) a la agencia de Moscú?","Aprobado ✓"]]},
  {t:"Jue 11:20",say:"La agencia responde: <i>«Клиенты согласны»</i>, los clientes están de acuerdo. Los pagos a los lodges quedan en espera de su sí.",sub:"Confirmado · ¿pagar a 4 lodges?",log:["11:20","La agencia confirmó. 4 pagos a lodges en espera de aprobación."],ph:[["done-msg","Confirmado","La agencia de Moscú aceptó. Reservado: $28,950.",""],["approve","Pago pendiente","¿Pagar a los 4 lodges <b>$19,800</b> en total?","Aprobar"]]},
  {t:"Jue 15:00",say:"Llegan las facturas de los lodges. El auxiliar las archiva por proyecto, avisa a finanzas <i>y devuelve cada comprobante de pago.</i>",sub:"4 facturas archivadas · 4 comprobantes devueltos",log:["15:00","<b>Auxiliar de facturas</b>: 4 facturas archivadas, finanzas avisadas por WhatsApp, comprobantes enviados por correo a los lodges."],ph:[["done-msg","Confirmado","La agencia de Moscú aceptó. Reservado: $28,950.",""],["approve tapped","Pago pendiente","¿Pagar a los 4 lodges <b>$19,800</b> en total?","Aprobado ✓"]]},
  {t:"Mayo 2027",say:"Los huéspedes llegan. El coordinador revisa cada traslado y guía <i>cada mañana, y el viaje vuelve a la memoria.</i>",sub:"Viaje completado · guardado en memoria",log:["Mayo","<b>Coordinador</b>: todos los traslados confirmados. Viaje guardado para la próxima propuesta."],ph:[["done-msg","Viaje completado","3 clientes llegaron bien a casa. La agencia pide repetir el viaje en octubre.",""]]}

const qlang=new URLSearchParams(location.search).get('lang');
let lang=(qlang && L[qlang])?qlang:'en', cur='dmc', i=-1, timer=null;
const $=id=>document.getElementById(id);
const S=()=>L[lang];

function applyStatic(){
  const d=S();
  document.documentElement.lang=lang;
  $("eyebrow").textContent=d.eyebrow;
  $("h1").innerHTML=d.h1;
  $("lede").textContent=d.lede;
  $("note").textContent=d.note;
  $("next").textContent=d.next;
  $("reset").textContent=d.reset;
  $("ph-team").textContent=d.team;
  $("ph-board").textContent=d.board;
  $("h-new").textContent=d.colNew;
  $("h-work").textContent=d.colWork;
  $("h-wait").textContent=d.colWait;
  $("h-done").textContent=d.colDone;
  $("ph-phone").textContent=d.phone;
  $("l-hrs").textContent=d.hrs;
  $("l-taps").textContent=d.taps;
  $("whyH").textContent=d.whyH;
  $("pick").textContent=d.pick;
  $("built").textContent=d.built;
  $("fh").textContent=d.fh;
  $("fb").textContent=d.fb;
  $("back").textContent=d.back;
  $("back").href="start.html?lang="+lang;
  document.querySelectorAll('.tabs button').forEach(b=>b.textContent=d.tabs[b.dataset.k]);
  $("play").textContent=timer?d.pause:d.play;
}

function drawAgents(on){
  const d=S();
  $("agents").innerHTML=d.agents.map((a,k)=>`<div class="agent${on.includes(AGENT_ID[k])?" on":""}"><span class="ic">${IC[k]}</span><div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join("");
}
function drawDots(){$("dots").innerHTML=S().steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}
function phone(list){
  const d=S();
  let h=`<div class="msg"><span class="from">${d.yourAgents}</span>${d.yourMsg}</div>`;
  (list||[]).forEach(([cls,from,txt,btn])=>{
    h+=`<div class="msg ${cls}"><span class="from">${from}</span>${txt}${btn?`<div class="btns"><span class="yes">${btn}</span><span>${d.edit}</span></div>`:""}</div>`;
  });
  $("screen").innerHTML=h;
}
function show(k){
  const d=S(); i=k; const st=d.steps[k];
  $("clock").textContent=st.t; $("say").innerHTML=st.say;
  ["c-new","c-work","c-wait","c-done"].forEach(c=>$(c).querySelectorAll(".card").forEach(x=>x.remove()));
  $(COL[k]).insertAdjacentHTML("beforeend",`<div class="card"><span class="chip">${CHIP[k]}</span><b>${d.party}</b><small>${st.sub}</small></div>`);
  drawAgents(ON[k]);
  $("feed").insertAdjacentHTML("afterbegin",`<div class="line"><span>${st.log[0]}</span><div>${st.log[1]}</div></div>`);
  const taps=TAPS[k]||Math.max(0,...TAPS.slice(0,k));
  $("hrs").textContent=HRS[k].toFixed(1);
  $("taps").textContent=taps;
  phone(st.ph);
  drawDots();
}
function stop(){clearInterval(timer);timer=null;$("play").textContent=S().play}
function next(){if(i<S().steps.length-1)show(i+1);else stop()}
function reset(){stop();$("feed").innerHTML="";show(0)}
function rebuild(){
  // re-draw the current point of the story in the selected language, keeping the position
  if(i<0){applyStatic();drawAgents([]);return}
  const k=i; $("feed").innerHTML=""; for(let s=0;s<=k;s++) show(s);
}
function sector(k){
  cur=k;
  const d=S();
  $("who").textContent=d.biz[k];
  $("three").innerHTML=d.cards[k].map(c=>`<div><b>${c[0]}</b><p>${c[1]}</p></div>`).join("");
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
function setLang(l){
  lang=l;
  const wasPlaying=!!timer;
  applyStatic();
  sector(cur);
  rebuild();
  if(i<0) reset();
  if(wasPlaying) $("play").textContent=S().pause;
}

$("play").onclick=()=>{
  if(timer){stop();return}
  if(i>=S().steps.length-1)reset();
  $("play").textContent=S().pause;
  timer=setInterval(next,3200);
};
$("next").onclick=()=>{stop();next()};
$("reset").onclick=reset;
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>sector(b.dataset.k)));
applyStatic();
sector('dmc');
reset();
</script>
</body></html>
